# Security audit suppression configuration — documented record of accepted advisories.
#
# `scripts/advisories.json` is the machine-readable SINGLE source of truth: the
# `just audit` recipe and CI generate `cargo audit --ignore <id>` flags from it
# (cargo-audit has no `--config` flag). This file and `deny.toml` mirror that
# list for documentation, and `scripts/check-advisories.py` enforces that (a) no
# review date has lapsed and (b) all three files list exactly the same advisory
# IDs. When you add or remove an advisory, update all three or the policy check
# fails.
#
# Review by: 2026-08-01 (see scripts/advisories.json for per-advisory dates).
[advisories]
ignore = [
  # rustls-pemfile unmaintained — transitive via gpui → gpui_http_client → zed-reqwest.
  # Review by: 2026-08-01.
  "RUSTSEC-2025-0134",

  # async-std discontinued — transitive via gpui → http_client → async-tar.
  # Review by: 2026-08-01.
  "RUSTSEC-2025-0052",

  # instant unmaintained — transitive via gpui → util → futures-lite → fastrand.
  # Review by: 2026-08-01.
  "RUSTSEC-2024-0384",

  # paste unmaintained — transitive via gpui → image/metal.
  # Review by: 2026-08-01.
  "RUSTSEC-2024-0436",

  # quick-xml quadratic-time DoS — transitive via gpui, semver-locked; artifact
  # never parses untrusted XML so the surface is unreachable. Review by 2026-08-01.
  "RUSTSEC-2026-0194",

  # quick-xml unbounded namespace allocation (DoS) — as above. Review by 2026-08-01.
  "RUSTSEC-2026-0195",

  # proc-macro-error2 unmaintained — build-time-only, transitive via gpui. Review by 2026-08-01.
  "RUSTSEC-2026-0173",

  # rustybuzz unmaintained — transitive via gpui text-shaping stack. Review by 2026-08-01.
  "RUSTSEC-2026-0206",

  # ttf-parser unmaintained — transitive via gpui font stack. Review by 2026-08-01.
  "RUSTSEC-2026-0192",
]
