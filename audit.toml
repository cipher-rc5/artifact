# Security audit suppression configuration.
#
# This is the SINGLE source of truth for accepted advisories that `cargo audit`
# consumes: the `just audit` recipe and CI both run `cargo audit --config
# audit.toml`, so there are no inline `--ignore` flags to keep in sync.
#
# The machine-readable copy at `scripts/advisories.json` carries the review
# dates; `scripts/check-advisories.py` enforces that (a) no review date has
# lapsed and (b) this file and `deny.toml` list exactly the same advisory IDs.
# When you add or remove an advisory here, update `scripts/advisories.json` and
# `deny.toml` to match, or the advisory policy check fails.
#
# Review by: 2026-08-01 (see scripts/advisories.json).
[advisories]
ignore = [
  # rustls-pemfile unmaintained — transitive via gpui → gpui_http_client → zed-reqwest.
  # Review by: 2026-08-01.
  "RUSTSEC-2025-0134",

  # async-std discontinued — transitive via gpui → http_client → async-tar.
  # Review by: 2026-08-01.
  "RUSTSEC-2025-0052",

  # instant unmaintained — transitive via gpui → util → futures-lite → fastrand.
  # Review by: 2026-08-01.
  "RUSTSEC-2024-0384",

  # paste unmaintained — transitive via gpui → image/metal.
  # Review by: 2026-08-01.
  "RUSTSEC-2024-0436",
]
