[package]
name = "grid"
version = "0.18.0"
authors = ["Armin Becher <armin.becher@gmai.com>"]
categories = ["science", "data-structures"]
documentation = "https://docs.rs/grid"
edition = "2024"
keywords = ["2D", "array", "matrix", "data-structure", "2D-vector"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/becheran/grid"
rust-version = "1.96"
description = "Dynamic generic 2D data structure."

# Local fork of grid 0.18.0 with GHSA-38c5-483c-4qqp backported (integer
# overflow in expand_rows/expand_cols). Used via [patch.crates-io] because the
# upstream fix only shipped in 1.0.1, which is semver-incompatible with the
# `grid ^0.18.0` requirement pinned transitively through taffy -> gpui.

[lib]
name = "grid"
path = "src/lib.rs"

[features]
default = ["std"]
serde = ["std", "dep:serde"]
std = []

[dependencies.serde]
version = "1.0.228"
features = ["derive"]
optional = true

[dev-dependencies]
serde_json = "1.0.150"
